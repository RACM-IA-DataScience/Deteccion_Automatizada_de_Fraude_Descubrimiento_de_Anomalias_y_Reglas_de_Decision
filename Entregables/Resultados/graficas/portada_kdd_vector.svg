<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%">
  <defs>
    <!-- Filtros de Glow Neón -->
    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-magenta" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradientes Principales -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0a1026" />
      <stop offset="100%" stop-color="#04060d" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1b3e" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#0a1228" stop-opacity="0.90" />
      <stop offset="100%" stop-color="#1e0b36" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <linearGradient id="cyan-mag" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <linearGradient id="chip-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <radialGradient id="radar-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    
    <pattern id="cyber-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.4" />
      <circle cx="0" cy="0" r="1.2" fill="#00f2fe" fill-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Fondo Base con Malla Cibernética -->
  <rect width="920" height="540" fill="url(#bg-grad)" rx="16" />
  <rect width="920" height="540" fill="url(#cyber-grid)" rx="16" />

  <!-- Círculos de Radar y Halo Orbital -->
  <circle cx="460" cy="180" r="160" fill="url(#radar-glow)" />
  <circle cx="460" cy="180" r="140" fill="none" stroke="#00f2fe" stroke-width="1" stroke-dasharray="4,8" stroke-opacity="0.3" />
  <circle cx="460" cy="180" r="110" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="6,6" stroke-opacity="0.5" />
  <circle cx="460" cy="180" r="80" fill="none" stroke="#00f2fe" stroke-width="2" stroke-opacity="0.7" filter="url(#glow-cyan)" />
  <circle cx="460" cy="180" r="50" fill="#0b1329" stroke="#f43f5e" stroke-width="2" stroke-opacity="0.8" filter="url(#glow-magenta)" />

  <!-- Ejes del Radar y Marcas de Grados -->
  <line x1="460" y1="20" x2="460" y2="340" stroke="#00f2fe" stroke-width="0.8" stroke-dasharray="2,4" stroke-opacity="0.25" />
  <line x1="300" y1="180" x2="620" y2="180" stroke="#00f2fe" stroke-width="0.8" stroke-dasharray="2,4" stroke-opacity="0.25" />

  <!-- Candado Criptográfico Central -->
  <g transform="translate(444, 160)">
    <rect x="0" y="14" width="32" height="26" rx="5" fill="#0f172a" stroke="#00f2fe" stroke-width="2" filter="url(#glow-cyan)" />
    <path d="M 7 14 V 8 A 9 9 0 0 1 25 8 V 14" fill="none" stroke="#f43f5e" stroke-width="2.8" stroke-linecap="round" filter="url(#glow-magenta)" />
    <circle cx="16" cy="25" r="3.5" fill="#00f2fe" />
    <line x1="16" y1="28.5" x2="16" y2="34" stroke="#00f2fe" stroke-width="2" />
  </g>

  <!-- Tarjeta de Crédito Inteligente Holográfica -->
  <g transform="translate(230, 210)">
    <!-- Sombra proyectada -->
    <rect x="10" y="10" width="460" height="230" rx="16" fill="#000000" opacity="0.6" filter="url(#glow-soft)" />
    
    <!-- Cuerpo de la tarjeta -->
    <rect x="0" y="0" width="460" height="230" rx="16" fill="url(#card-grad)" stroke="url(#card-border)" stroke-width="2.2" filter="url(#glow-soft)" />
    
    <!-- Líneas de circuito dentro de la tarjeta -->
    <path d="M 0 60 Q 120 40 200 70 T 460 50" fill="none" stroke="#00f2fe" stroke-width="1.2" stroke-opacity="0.2" />
    <path d="M 0 160 Q 150 180 280 140 T 460 170" fill="none" stroke="#f43f5e" stroke-width="1.2" stroke-opacity="0.2" />

    <!-- Chip EMV Inteligente -->
    <g transform="translate(36, 40)">
      <rect x="0" y="0" width="48" height="38" rx="6" fill="url(#chip-grad)" stroke="#b45309" stroke-width="1.5" />
      <path d="M 0 19 H 48 M 16 0 V 38 M 32 0 V 38" fill="none" stroke="#78350f" stroke-width="1" />
      <circle cx="24" cy="19" r="6" fill="none" stroke="#78350f" stroke-width="1.2" />
    </g>

    <!-- Indicador de Antena Contactless (NFC) -->
    <g transform="translate(96, 52)">
      <path d="M 0 4 A 10 10 0 0 1 0 20" fill="none" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" />
      <path d="M 6 0 A 16 16 0 0 1 6 24" fill="none" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" />
      <path d="M 12 -4 A 22 22 0 0 1 12 28" fill="none" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Badge Online Engine -->
    <g transform="translate(310, 36)">
      <rect x="0" y="0" width="120" height="26" rx="13" fill="#0b1736" stroke="#00f2fe" stroke-width="1" />
      <circle cx="14" cy="13" r="4" fill="#00f2fe" filter="url(#glow-cyan)" />
      <text x="26" y="17" fill="#e2e8f0" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="bold" letter-spacing="0.5">KDD·AI ENGINE</text>
    </g>

    <!-- Número de Tarjeta y Fechas -->
    <text x="36" y="125" fill="#f8fafc" font-family="'Courier New', monospace" font-size="20" font-weight="bold" letter-spacing="4" filter="url(#glow-soft)">4152  ••••  ••••  2026</text>
    
    <!-- Metadatos de la Tarjeta -->
    <text x="36" y="165" fill="#94a3b8" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="bold" letter-spacing="1">MODELO CAMPEÓN</text>
    <text x="36" y="185" fill="#00f2fe" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" letter-spacing="0.5">RANDOM FOREST · SMOTE</text>

    <text x="280" y="165" fill="#94a3b8" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="bold" letter-spacing="1">VEREDICTO EN TIEMPO REAL</text>
    <text x="280" y="185" fill="#10b981" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" letter-spacing="0.5">REAL-TIME PROTECTED</text>
    
    <!-- Badge Alerta Anómala Superpuesta -->
    <g transform="translate(260, 95)">
      <rect x="0" y="0" width="165" height="24" rx="12" fill="#450a0a" stroke="#f43f5e" stroke-width="1.5" filter="url(#glow-magenta)" />
      <circle cx="12" cy="12" r="4" fill="#f43f5e" />
      <text x="24" y="16" fill="#fecdd3" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="bold" letter-spacing="0.5">ANOMALY DETECTED</text>
    </g>
  </g>

  <!-- Línea de Pulso EKG / Telemetría Transaccional con Pico de Fraude -->
  <path d="M 40 460 L 220 460 L 240 450 L 255 470 L 270 460 L 400 460 L 415 440 L 425 480 L 440 430 L 450 495 L 465 370 L 480 515 L 495 445 L 510 475 L 525 460 L 680 460 L 700 450 L 715 470 L 730 460 L 880 460" 
        fill="none" stroke="#00f2fe" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-cyan)" />
        
  <!-- Resaltado Magenta en la Zona de Anomalía Crítica del Pulso -->
  <path d="M 440 430 L 450 495 L 465 370 L 480 515 L 495 445 L 510 475" 
        fill="none" stroke="#f43f5e" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-magenta)" />
        
  <!-- Puntos Clave en la Telemetría -->
  <circle cx="465" cy="370" r="5" fill="#f43f5e" filter="url(#glow-magenta)" />
  <circle cx="480" cy="515" r="5" fill="#00f2fe" filter="url(#glow-cyan)" />

  <!-- Tags Flotantes de Alto Rendimiento KDD -->
  <!-- Tag Superior Izquierdo -->
  <g transform="translate(140, 80)">
    <rect x="0" y="0" width="150" height="30" rx="8" fill="#0b1736" stroke="#00f2fe" stroke-width="1.2" filter="url(#glow-cyan)" />
    <circle cx="16" cy="15" r="4.5" fill="#00f2fe" />
    <text x="30" y="19" fill="#00f2fe" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="bold" letter-spacing="0.5">RULE R1: LIFT 16.46x</text>
  </g>

  <!-- Tag Superior Derecho -->
  <g transform="translate(630, 80)">
    <rect x="0" y="0" width="160" height="30" rx="8" fill="#2d0612" stroke="#f43f5e" stroke-width="1.2" filter="url(#glow-magenta)" />
    <circle cx="16" cy="15" r="4.5" fill="#f43f5e" />
    <text x="30" y="19" fill="#f43f5e" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="bold" letter-spacing="0.5">ANOMALY: +3.75x LIFT</text>
  </g>

  <!-- Tag Lateral Derecho Inferior -->
  <g transform="translate(710, 270)">
    <rect x="0" y="0" width="175" height="32" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.2" />
    <text x="14" y="20" fill="#c084fc" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="bold">LATENCIA &lt; 12 MS</text>
  </g>

  <!-- Tag Lateral Izquierdo Inferior -->
  <g transform="translate(35, 270)">
    <rect x="0" y="0" width="175" height="32" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.2" />
    <text x="14" y="20" fill="#34d399" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="bold">ZERO DATA LEAKAGE</text>
  </g>

</svg>